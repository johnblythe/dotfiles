<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROI Platform Team Pods</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    h1 {
      color: #fff;
      font-size: 2.5rem;
      font-weight: 600;
      margin-bottom: 50px;
      text-align: center;
      letter-spacing: -0.5px;
    }

    .container {
      display: flex;
      gap: 60px;
      align-items: flex-start;
    }

    .pod {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      padding: 32px;
      min-width: 280px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .pod-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .pod-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .pod-1 .pod-icon {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .pod-2 .pod-icon {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }

    .pod-title {
      color: #fff;
      font-size: 1.4rem;
      font-weight: 600;
    }

    .pod-count {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.9rem;
      font-weight: 400;
    }

    .members {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .member {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      transition: all 0.2s ease;
    }

    .member:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateX(4px);
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.85rem;
      color: #fff;
    }

    .pod-1 .avatar {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .pod-2 .avatar {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }

    .name {
      color: #fff;
      font-size: 1.05rem;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <h1>ROI Platform Team</h1>

  <div class="container">
    <div class="pod pod-1">
      <div class="pod-header">
        <div class="pod-icon">1</div>
        <div>
          <div class="pod-title">Pod 1</div>
          <div class="pod-count">8 members</div>
        </div>
      </div>
      <div class="members">
        <div class="member">
          <div class="avatar">MS</div>
          <div class="name">Michael</div>
        </div>
        <div class="member">
          <div class="avatar">AM</div>
          <div class="name">Alagu</div>
        </div>
        <div class="member">
          <div class="avatar">AB</div>
          <div class="name">Aravind</div>
        </div>
        <div class="member">
          <div class="avatar">JF</div>
          <div class="name">Jonathan</div>
        </div>
        <div class="member">
          <div class="avatar">JN</div>
          <div class="name">Jeff</div>
        </div>
        <div class="member">
          <div class="avatar">JY</div>
          <div class="name">Joshua</div>
        </div>
        <div class="member">
          <div class="avatar">IP</div>
          <div class="name">Ivan</div>
        </div>
        <div class="member">
          <div class="avatar">SR</div>
          <div class="name">Soma</div>
        </div>
      </div>
    </div>

    <div class="pod pod-2">
      <div class="pod-header">
        <div class="pod-icon">2</div>
        <div>
          <div class="pod-title">Pod 2</div>
          <div class="pod-count">6 members</div>
        </div>
      </div>
      <div class="members">
        <div class="member">
          <div class="avatar">DL</div>
          <div class="name">Dillon</div>
        </div>
        <div class="member">
          <div class="avatar">SG</div>
          <div class="name">Stephen</div>
        </div>
        <div class="member">
          <div class="avatar">JM</div>
          <div class="name">Joseph</div>
        </div>
        <div class="member">
          <div class="avatar">RK</div>
          <div class="name">Rama</div>
        </div>
        <div class="member">
          <div class="avatar">AJ</div>
          <div class="name">Alosiyus</div>
        </div>
        <div class="member">
          <div class="avatar">SK</div>
          <div class="name">Saravana</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
